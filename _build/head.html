<title>Google Ads Mastery Curriculum</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
<style>
/* ============================================================
   TOKENS — light is the base; dark redefines only the values
   ============================================================ */
:root{
  --paper:#FAFAF6; --surface:#FFFFFF; --rail:#F2F3EE;
  --ink:#161A18; --ink-2:#4C5551; --ink-3:#7E8983;
  --rule:#E1E5DF; --rule-soft:#EDF0EA;
  --accent:#14664B; --accent-ink:#0C4433; --accent-soft:#E4EFE9;
  --warn:#8F5514; --warn-soft:#F6EDDF; --warn-line:#E3C79E;
  --flag:#8C2F39; --flag-soft:#F7E7E7;
  --on-accent:#FFFFFF;
  --star:#B07D19; --star-soft:#FAF0DA;
  --info:#1F5B8F; --info-soft:#E3EDF6;
  --mark:#8C2F39; --mark-soft:#F9E9E9;
  --shadow:0 1px 2px rgba(22,26,24,.05),0 8px 24px -12px rgba(22,26,24,.18);
  --ff-ui:'Archivo','Helvetica Neue',Arial,sans-serif;
  --ff-text:'Source Serif 4',Georgia,'Times New Roman',serif;
  --ff-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --rail-w:306px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1412; --surface:#151C19; --rail:#111815;
    --ink:#E9EEE9; --ink-2:#A3AEA8; --ink-3:#6E7A74;
    --rule:#232E29; --rule-soft:#1B2421;
    --accent:#57C39A; --accent-ink:#8FDCBB; --accent-soft:#122C23;
    --warn:#D5A05E; --warn-soft:#2C2317; --warn-line:#4C3B23;
    --flag:#E38C93; --flag-soft:#2E1B1D;
    --on-accent:#06130E;
    --star:#DCB35C; --star-soft:#2A2314;
    --info:#7FB4E0; --info-soft:#12263A;
    --mark:#E38C93; --mark-soft:#2E1B1D;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#0E1412; --surface:#151C19; --rail:#111815;
  --ink:#E9EEE9; --ink-2:#A3AEA8; --ink-3:#6E7A74;
  --rule:#232E29; --rule-soft:#1B2421;
  --accent:#57C39A; --accent-ink:#8FDCBB; --accent-soft:#122C23;
  --warn:#D5A05E; --warn-soft:#2C2317; --warn-line:#4C3B23;
  --flag:#E38C93; --flag-soft:#2E1B1D;
  --on-accent:#06130E;
  --star:#DCB35C; --star-soft:#2A2314;
  --info:#7FB4E0; --info-soft:#12263A;
  --mark:#E38C93; --mark-soft:#2E1B1D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--ff-text);font-size:17px;line-height:1.62;font-optical-sizing:auto;
}
::selection{background:var(--accent-soft);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============================================================
   MASTHEAD
   ============================================================ */
.masthead{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;
  padding:12px 22px;background:var(--surface);border-bottom:1px solid var(--rule);
}
.mh-brand{display:flex;align-items:baseline;gap:12px;min-width:0;text-decoration:none;flex:1}
.mh-brand h1{
  font-family:var(--ff-text);font-weight:700;font-size:19px;letter-spacing:-.014em;
  margin:0;color:var(--ink);white-space:nowrap;
}
.mh-meta{
  font-family:var(--ff-mono);font-size:10.5px;letter-spacing:.03em;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.mh-search{position:relative;flex:0 0 auto}
.mh-search svg{
  position:absolute;left:9px;top:50%;transform:translateY(-50%);
  width:13px;height:13px;color:var(--ink-3);pointer-events:none;
}
.filter{
  width:210px;font-family:var(--ff-ui);font-size:12.5px;color:var(--ink);
  background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:7px 10px 7px 27px;
}
.filter::placeholder{color:var(--ink-3)}
.filter:focus{border-color:var(--accent);outline:none}

/* ============================================================
   SHELL
   ============================================================ */
.app{display:flex;align-items:flex-start}
.rail{
  width:var(--rail-w);flex:0 0 var(--rail-w);background:var(--rail);
  border-right:1px solid var(--rule);position:sticky;top:53px;
  height:calc(100vh - 53px);display:flex;flex-direction:column;
}
.rail-head{padding:16px 16px 14px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:12px}

/* progress ring */
.side-prog{display:flex;align-items:center;gap:13px}
.ring{width:46px;height:46px;flex:0 0 auto;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.4;stroke-linecap:round}
.ring .bg{stroke:var(--rule)}
.ring .fg{stroke:var(--accent);transition:stroke-dashoffset .5s ease}
.side-prog b{
  display:block;font-family:var(--ff-ui);font-weight:700;font-size:21px;
  letter-spacing:-.02em;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums;
}
.side-prog span{
  display:block;margin-top:2px;font-family:var(--ff-mono);font-size:10px;
  color:var(--ink-3);letter-spacing:.02em;
}

/* sidebar news card */
.newscard{
  display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;
  padding:10px 11px;border-radius:7px;cursor:pointer;
  background:var(--warn-soft);border:1px solid var(--warn-line);
}
.newscard:hover{filter:brightness(.985)}
.newscard .nc-ico{
  flex:0 0 auto;width:17px;height:17px;border-radius:4px;background:var(--warn);
  color:var(--paper);display:grid;place-items:center;margin-top:1px;
}
.newscard .nc-ico svg{width:10px;height:10px}
.newscard .nc-txt{flex:1;min-width:0}
.newscard b{
  display:block;font-family:var(--ff-ui);font-size:12.5px;font-weight:600;
  color:var(--ink);line-height:1.3;
}
.newscard span{
  display:block;margin-top:2px;font-family:var(--ff-mono);font-size:9.5px;
  color:var(--ink-3);letter-spacing:.02em;line-height:1.4;
}
.nc-count{
  flex:0 0 auto;min-width:19px;height:19px;padding:0 5px;border-radius:99px;
  background:var(--warn);color:var(--paper);display:grid;place-items:center;
  font-family:var(--ff-mono);font-size:10px;font-weight:500;
}

.dashlink{
  display:flex;align-items:center;gap:8px;width:100%;padding:9px 11px;border-radius:7px;
  background:var(--accent-soft);border:1px solid transparent;color:var(--accent-ink);
  font-family:var(--ff-ui);font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:none;
}
.dashlink:hover{border-color:var(--accent)}
.dashlink svg{width:14px;height:14px;flex:0 0 auto}
.dashlink.on{background:var(--accent);color:var(--on-accent)}

/* filter pills */
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{
  font-family:var(--ff-ui);font-size:11px;font-weight:600;padding:4px 9px;
  border-radius:99px;border:1px solid var(--rule);background:var(--surface);
  color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:4px;
}
.pill:hover{border-color:var(--ink-3)}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pill i{font-style:normal;font-size:10px}

/* ============================================================
   TREE
   ============================================================ */
.rail-nav{overflow-y:auto;flex:1;padding:8px 10px 40px;scrollbar-width:thin}
.lvl-head,.mod-head{
  display:flex;align-items:center;gap:7px;width:100%;text-align:left;
  background:none;border:0;cursor:pointer;border-radius:5px;
}
.lvl-head{padding:7px 7px;margin-top:8px}
.lvl-head:hover,.mod-head:hover{background:var(--rule-soft)}
.caret{
  flex:0 0 auto;width:9px;height:9px;color:var(--ink-3);
  transition:transform .16s ease;transform:rotate(-90deg);
}
.open>.lvl-head .caret,.open>.mod-head .caret{transform:none}
.lvl-tag{
  font-family:var(--ff-mono);font-size:9.5px;letter-spacing:.05em;color:var(--accent);flex:0 0 auto;
}
.lvl-name{
  flex:1;min-width:0;font-family:var(--ff-ui);font-size:11px;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase;color:var(--ink);
}
.lvl-pct,.mod-pct{
  flex:0 0 auto;font-family:var(--ff-mono);font-size:9.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}
.mod-head{padding:6px 7px 6px 16px}
.mod-tag{font-family:var(--ff-mono);font-size:9.5px;color:var(--ink-3);flex:0 0 auto}
.mod-name{
  flex:1;min-width:0;font-family:var(--ff-ui);font-size:11.5px;font-weight:600;
  color:var(--ink-2);line-height:1.35;
}
.lvl-body,.mod-body{display:none}
.open>.lvl-body,.open>.mod-body{display:block}

.lesson-link{
  display:grid;grid-template-columns:11px 20px 1fr auto;gap:7px;align-items:baseline;
  padding:5px 7px 5px 26px;border-radius:5px;text-decoration:none;color:var(--ink-2);
  font-family:var(--ff-ui);font-size:12px;line-height:1.4;
}
.lesson-link:hover{background:var(--rule-soft);color:var(--ink)}
.lesson-link.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.dot{
  width:8px;height:8px;border-radius:50%;border:1.4px solid var(--rule);
  align-self:center;flex:0 0 auto;box-sizing:border-box;
}
.lesson-link.seen .dot{border-color:var(--warn);background:var(--warn-soft)}
.lesson-link.done .dot{border-color:var(--accent);background:var(--accent)}
.lesson-link .num{font-family:var(--ff-mono);font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.lesson-link.on .num{color:var(--accent)}
.lesson-link.done .t{color:var(--ink-3)}
.lesson-link.done:hover .t,.lesson-link.done.on .t{color:var(--accent-ink)}
.lesson-link .marks{font-size:9px;letter-spacing:1px;white-space:nowrap;align-self:center}
.rail-nav .empty{padding:18px 10px;font-family:var(--ff-ui);font-size:12px;color:var(--ink-3);line-height:1.5}

/* ============================================================
   MAIN + TOPBAR
   ============================================================ */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topwrap{position:sticky;top:53px;z-index:30}
.topbar{
  display:flex;align-items:center;gap:12px;padding:9px 24px;
  background:var(--paper);background:color-mix(in srgb,var(--paper) 90%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);
}
.crumb{
  flex:1;min-width:0;font-family:var(--ff-mono);font-size:10.5px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.crumb b{color:var(--accent);font-weight:500}
.icon-btn{
  display:grid;place-items:center;width:31px;height:31px;flex:0 0 auto;
  background:transparent;border:1px solid var(--rule);border-radius:5px;
  color:var(--ink-2);cursor:pointer;padding:0;
}
.icon-btn:hover{background:var(--rule-soft);color:var(--ink)}
.icon-btn svg{width:14px;height:14px;display:block}
#menuBtn{display:none}
.newsbtn{position:relative}
.badge{
  position:absolute;top:-5px;right:-5px;min-width:15px;height:15px;padding:0 4px;
  display:grid;place-items:center;border-radius:99px;background:var(--flag);
  color:#fff;font-family:var(--ff-mono);font-size:9px;line-height:1;
}
.newsstrip{
  display:flex;align-items:center;gap:10px;padding:7px 24px;
  background:var(--accent-soft);border-bottom:1px solid var(--rule);
  font-family:var(--ff-ui);font-size:12.5px;min-width:0;
}
.newsstrip .ns-label{
  font-family:var(--ff-mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--accent);flex:0 0 auto;
}
.newsstrip .ns-title{flex:1;min-width:0;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.newsstrip .ns-open{
  flex:0 0 auto;background:none;border:0;padding:0;cursor:pointer;font:inherit;
  font-weight:600;color:var(--accent-ink);text-decoration:underline;text-underline-offset:2px;
}
.newsstrip .ns-hide{flex:0 0 auto;background:none;border:0;padding:0 0 0 4px;cursor:pointer;color:var(--ink-3);font-size:15px;line-height:1}
.newsstrip .ns-hide:hover{color:var(--ink)}

/* ============================================================
   DOCUMENT
   ============================================================ */
.doc{width:100%;padding:36px 24px 8px;--col:70ch}
.doc>*{max-width:var(--col);margin-inline:auto}
.lesson-head{max-width:var(--col);margin:0 auto 28px;padding-bottom:20px;border-bottom:1px solid var(--rule)}
.eyebrow{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  font-family:var(--ff-mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:13px;
}
.eyebrow .no{color:var(--accent);font-weight:500}
.eyebrow .sep{width:3px;height:3px;border-radius:50%;background:var(--rule);flex:0 0 auto}
.lesson-head h1{
  font-family:var(--ff-ui);font-weight:700;font-size:clamp(26px,3.5vw,37px);
  line-height:1.14;letter-spacing:-.024em;margin:0;color:var(--ink);text-wrap:balance;
}
.meta-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:15px}
.chip{
  display:inline-flex;align-items:center;gap:6px;font-family:var(--ff-mono);font-size:10.5px;
  letter-spacing:.04em;padding:4px 9px;border-radius:99px;border:1px solid var(--rule);color:var(--ink-2);
}
.chip.lv{border-color:transparent;background:var(--accent-soft);color:var(--accent-ink)}
.chip.tpl{border-color:transparent;background:var(--warn-soft);color:var(--warn)}
.ladder{display:flex;gap:2px;align-items:center}
.ladder i{width:9px;height:3px;border-radius:1px;background:var(--rule);display:block}
.ladder i.f{background:var(--accent)}

.doc h2{
  font-family:var(--ff-ui);font-weight:700;font-size:22.5px;letter-spacing:-.016em;line-height:1.25;
  margin:42px auto 13px;color:var(--ink);text-wrap:balance;padding-top:14px;border-top:1px solid var(--rule-soft);
}
.doc h2:first-of-type{border-top:0;padding-top:0}
.doc h3{font-family:var(--ff-ui);font-weight:600;font-size:17px;letter-spacing:-.008em;margin:28px auto 8px;color:var(--ink);text-wrap:balance}
.doc h4{font-family:var(--ff-mono);font-weight:500;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:22px auto 6px}
.doc p{margin:0 auto 15px}
.doc strong{font-weight:600;color:var(--ink)}
.doc a{color:var(--accent);text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
.doc a:hover{color:var(--accent-ink)}
.doc ul,.doc ol{margin:0 auto 16px;padding-left:1.35em}
.doc li{margin-bottom:6px}
.doc li>ul,.doc li>ol{margin-top:6px;margin-bottom:2px}
.doc hr{border:0;height:1px;background:var(--rule);margin:32px auto;max-width:var(--col)}
.doc blockquote{margin:20px auto;padding:2px 0 2px 18px;border-left:2px solid var(--accent);color:var(--ink-2);font-style:italic}
.doc blockquote p:last-child{margin-bottom:0}
.doc code{font-family:var(--ff-mono);font-size:.84em;background:var(--rule-soft);padding:1.5px 5px;border-radius:3px;color:var(--ink)}
.doc pre{max-width:var(--col);margin:20px auto;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;overflow-x:auto;line-height:1.55}
.doc pre code{background:none;padding:0;font-size:12.5px;color:var(--ink-2)}
.tablewrap{max-width:var(--col);margin:22px auto;overflow-x:auto;border:1px solid var(--rule);border-radius:6px}
.doc table{border-collapse:collapse;width:100%;font-family:var(--ff-ui);font-size:13.5px;background:var(--surface)}
.doc thead th{
  text-align:left;font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-3);padding:10px 14px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--rail);
}
.doc tbody td{padding:10px 14px;border-bottom:1px solid var(--rule-soft);color:var(--ink-2);vertical-align:top;font-variant-numeric:tabular-nums}
.doc tbody tr:last-child td{border-bottom:0}
.doc tbody td strong{color:var(--ink)}
.doc p.callout{background:var(--warn-soft);border-left:2px solid var(--warn);padding:12px 16px;border-radius:0 5px 5px 0;color:var(--ink-2);margin-block:20px}
.doc p.callout strong{color:var(--ink)}

.pager{display:flex;gap:12px;max-width:70ch;margin:32px auto 0;padding:0 24px 60px;width:100%}
.pg{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding:13px 15px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);text-decoration:none}
.pg:hover{border-color:var(--accent);background:var(--accent-soft)}
.pg span{font-family:var(--ff-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.pg b{font-family:var(--ff-ui);font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.35}
.pg.next{text-align:right}
.pg.ghost{visibility:hidden}
.pg.cue{border-color:var(--accent);background:var(--accent-soft)}
.pg.cue b{color:var(--accent-ink)}

/* ============================================================
   LESSON ACTION BAR — the course's own sections, made trackable
   ============================================================ */
.actions{
  max-width:var(--col);margin:38px auto 0;border:1px solid var(--rule);
  border-radius:8px;background:var(--surface);overflow:hidden;
}
.actions.isdone{border-color:transparent;background:var(--accent-soft)}
.act-main{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;padding:16px 18px}
.act-txt b{display:block;font-family:var(--ff-ui);font-size:14.5px;font-weight:600;color:var(--ink);letter-spacing:-.006em}
.actions.isdone .act-txt b{color:var(--accent-ink)}
.act-txt span{display:block;margin-top:2px;font-family:var(--ff-mono);font-size:10.5px;letter-spacing:.03em;color:var(--ink-3);line-height:1.5}
.btn{
  font-family:var(--ff-ui);font-size:13px;font-weight:600;line-height:1.3;padding:9px 15px;
  border-radius:5px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);
  cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:7px;
}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08);border-color:var(--accent)}
.act-row{display:flex;flex-wrap:wrap;gap:7px;padding:0 18px 16px}
.tog{
  font-family:var(--ff-ui);font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:99px;
  border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;
}
.tog:hover{border-color:var(--ink-3);color:var(--ink)}
.tog.on{border-color:transparent;background:var(--accent-soft);color:var(--accent-ink)}
.tog.on.star{background:var(--star-soft);color:var(--star)}
.tog.on.mark{background:var(--mark-soft);color:var(--mark)}
.notebox{padding:0 18px 16px}
.notebox textarea{
  width:100%;min-height:88px;resize:vertical;font-family:var(--ff-text);font-size:14.5px;
  line-height:1.6;color:var(--ink);background:var(--paper);border:1px solid var(--rule);
  border-radius:6px;padding:11px 13px;
}
.notebox textarea:focus{border-color:var(--accent);outline:none}
.notebox .hint{font-family:var(--ff-mono);font-size:9.5px;color:var(--ink-3);margin-top:5px;letter-spacing:.03em}

/* sequence check */
.linkbtn{
  background:none;border:0;padding:0;font:inherit;color:var(--ink-3);cursor:pointer;
  text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px;font-size:12.5px;
  font-family:var(--ff-ui);
}
.linkbtn:hover{color:var(--ink)}
.skipwarn{
  max-width:var(--col);margin:0 auto 30px;padding:18px 20px;
  background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:8px;
}
.skipwarn h3{font-family:var(--ff-ui);font-size:14.5px;font-weight:700;letter-spacing:-.006em;margin:0 0 7px;color:var(--warn)}
.skipwarn>p{font-family:var(--ff-ui);font-size:13.5px;line-height:1.5;color:var(--ink-2);margin:0 0 13px;max-width:none}
.skipwarn ol{list-style:none;margin:0 0 13px;padding:0;display:flex;flex-direction:column;gap:2px}
.skipwarn ol li{margin:0}
.skipwarn ol a{
  display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:baseline;padding:7px 9px;
  border-radius:4px;text-decoration:none;background:var(--surface);
  font-family:var(--ff-ui);font-size:13px;line-height:1.4;color:var(--ink-2);
}
.skipwarn ol a:hover{color:var(--ink);background:var(--paper)}
.skipwarn ol .num{font-family:var(--ff-mono);font-size:10.5px;color:var(--warn);font-variant-numeric:tabular-nums}
.skipwarn .more{font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-3);padding:2px 9px 12px;letter-spacing:.03em}
.skipwarn .acts{display:flex;flex-wrap:wrap;align-items:center;gap:10px}

/* ============================================================
   DASHBOARD
   ============================================================ */
.dash{width:100%;padding:38px 24px 70px;--col:74ch}
.dash>*{max-width:var(--col);margin-inline:auto}
.dash h1{
  font-family:var(--ff-text);font-weight:700;font-size:clamp(30px,4vw,40px);
  letter-spacing:-.022em;line-height:1.1;margin:0 0 14px;color:var(--ink);
}
.dash .lede{font-size:17px;color:var(--ink-2);margin:0 0 30px;max-width:56ch}

.hero-card{
  border:1px solid var(--rule);border-radius:10px;background:var(--surface);
  padding:26px 28px;display:flex;flex-wrap:wrap;align-items:center;gap:26px;margin-bottom:26px;
}
.hero-ring{width:96px;height:96px;flex:0 0 auto;transform:rotate(-90deg)}
.hero-ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.hero-ring .bg{stroke:var(--rule)}
.hero-ring .fg{stroke:var(--accent);transition:stroke-dashoffset .6s ease}
.hero-info{flex:1;min-width:220px}
.hero-info .pc{
  font-family:var(--ff-mono);font-weight:500;font-size:34px;letter-spacing:-.02em;
  color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums;
}
.hero-info .sub{font-family:var(--ff-ui);font-size:13px;color:var(--ink-2);margin-top:5px}
.hero-info .rank{font-family:var(--ff-ui);font-size:13px;color:var(--ink-2);margin-top:6px}
.hero-info .rank b{color:var(--accent-ink);font-weight:700}
.hero-cta{margin-top:16px}

.tiles{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:11px;margin-bottom:34px;
}
.tile{
  border:1px solid var(--rule);border-radius:8px;background:var(--surface);padding:14px 15px;
  text-align:left;cursor:pointer;font:inherit;color:inherit;
}
.tile:hover{border-color:var(--accent)}
.tile b{
  display:block;font-family:var(--ff-ui);font-weight:700;font-size:25px;letter-spacing:-.02em;
  color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums;
}
.tile span{
  display:block;margin-top:4px;font-family:var(--ff-ui);font-size:11.5px;color:var(--ink-3);line-height:1.35;
}
.tile.lit b{color:var(--accent)}

.sec-h{
  display:flex;align-items:center;gap:8px;font-family:var(--ff-mono);font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  margin:0 0 12px;padding-bottom:9px;border-bottom:1px solid var(--rule);
}
.dash section{margin-bottom:32px}

.barrow{display:grid;grid-template-columns:20px 1fr 118px 46px;gap:12px;align-items:center;padding:7px 0}
.barrow .ix{font-family:var(--ff-mono);font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.barrow .nm{font-family:var(--ff-ui);font-size:13.5px;color:var(--ink-2)}
.barrow.hit .nm{color:var(--ink);font-weight:600}
.bar{height:5px;border-radius:3px;background:var(--rule-soft);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .5s ease}
.barrow .ct{font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
.barrow.hit .ct{color:var(--accent)}

.rowlist{border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--surface)}
.rowlist a{
  display:flex;align-items:center;gap:12px;padding:11px 15px;text-decoration:none;
  border-bottom:1px solid var(--rule-soft);
}
.rowlist a:last-child{border-bottom:0}
.rowlist a:hover{background:var(--paper)}
.rowlist .n{font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-3);flex:0 0 46px;font-variant-numeric:tabular-nums}
.rowlist .ti{flex:1;min-width:0;font-family:var(--ff-ui);font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.35}
.rowlist .st{font-family:var(--ff-mono);font-size:10px;color:var(--ink-3);text-align:right;flex:0 0 auto;white-space:nowrap}

.twocol{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.emptybox{
  border:1px dashed var(--rule);border-radius:8px;padding:16px;
  font-family:var(--ff-ui);font-size:12.5px;line-height:1.55;color:var(--ink-3);
}
.notecard{
  border:1px solid var(--rule);border-left:2px solid var(--accent);border-radius:0 7px 7px 0;
  background:var(--surface);padding:13px 15px;margin-bottom:9px;
}
.notecard a{
  font-family:var(--ff-mono);font-size:10px;color:var(--accent);text-decoration:none;
  letter-spacing:.04em;display:block;margin-bottom:5px;
}
.notecard a:hover{text-decoration:underline}
.notecard p{margin:0;font-size:14.5px;color:var(--ink-2);white-space:pre-wrap}

/* move progress between devices */
.syncbox{border:1px solid var(--rule);border-radius:8px;background:var(--surface);padding:16px 18px}
.syncbox p{font-family:var(--ff-ui);font-size:12.5px;line-height:1.55;color:var(--ink-3);margin:0 0 12px}
.syncbox textarea{
  width:100%;height:76px;resize:vertical;font-family:var(--ff-mono);font-size:11px;line-height:1.5;
  color:var(--ink-2);background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:9px 11px;
  word-break:break-all;
}
.syncbox textarea:focus{border-color:var(--accent);outline:none}
.sync-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.sync-msg{font-family:var(--ff-mono);font-size:10.5px;color:var(--accent);letter-spacing:.03em}
.sync-msg.bad{color:var(--flag)}

/* ============================================================
   NEWS PANEL
   ============================================================ */
.panel{
  position:fixed;top:0;right:0;bottom:0;width:400px;max-width:92vw;z-index:70;
  background:var(--surface);border-left:1px solid var(--rule);box-shadow:var(--shadow);
  display:flex;flex-direction:column;transform:translateX(100%);transition:transform .24s ease;
}
.panel.open{transform:none}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 20px 14px;border-bottom:1px solid var(--rule)}
.panel-head h2{font-family:var(--ff-ui);font-size:16px;font-weight:700;letter-spacing:-.012em;margin:0 0 4px;color:var(--ink)}
.panel-head .rev{font-family:var(--ff-mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.panel-body{overflow-y:auto;flex:1;padding:16px 20px 40px;scrollbar-width:thin}
.panel-note{
  font-family:var(--ff-ui);font-size:12px;line-height:1.55;color:var(--ink-3);
  background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:6px;padding:11px 13px;margin:0 0 20px;
}
.entry{padding:15px 0;border-bottom:1px solid var(--rule-soft)}
.entry:first-child{padding-top:2px}
.entry-top{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.tag{font-family:var(--ff-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:3px;line-height:1}
.tag.new,.tag.changed{background:var(--accent-soft);color:var(--accent-ink)}
.tag.renamed,.tag.merged{background:var(--warn-soft);color:var(--warn)}
.tag.sunset,.tag.policy{background:var(--flag-soft);color:var(--flag)}
/* live announcement sources */
.tag.news{background:var(--rule-soft);color:var(--ink-3)}
.tag.src-google-ads{background:var(--accent-soft);color:var(--accent-ink)}
.tag.src-ads-api{background:var(--warn-soft);color:var(--warn)}
.tag.src-meta{background:var(--info-soft);color:var(--info)}
.tag.src-google-search{background:var(--rule-soft);color:var(--ink-2)}
.entry.live h3{font-weight:600}

/* source filter inside the panel */
.srcbar{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 16px}
.srcbar button{
  font-family:var(--ff-ui);font-size:10.5px;font-weight:600;padding:4px 9px;
  border-radius:99px;border:1px solid var(--rule);background:var(--paper);
  color:var(--ink-2);cursor:pointer;
}
.srcbar button:hover{border-color:var(--ink-3)}
.srcbar button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.panel-updated{
  font-family:var(--ff-mono);font-size:9.5px;color:var(--ink-3);
  letter-spacing:.03em;margin:0 0 14px;
}
.panel-updated b{color:var(--accent);font-weight:500}
.entry-date{font-family:var(--ff-mono);font-size:9.5px;color:var(--ink-3);letter-spacing:.04em}
.entry.unread .entry-top::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--flag);flex:0 0 auto}
.entry h3{font-family:var(--ff-ui);font-size:14px;font-weight:600;line-height:1.35;letter-spacing:-.006em;margin:0 0 5px;color:var(--ink)}
.entry p{font-family:var(--ff-ui);font-size:12.5px;line-height:1.55;color:var(--ink-2);margin:0 0 9px}
.entry-links{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.entry-links .lk{font-family:var(--ff-mono);font-size:9.5px;letter-spacing:.03em;padding:3px 7px;border-radius:3px;border:1px solid var(--rule);color:var(--ink-2);text-decoration:none}
.entry-links .lk:hover{border-color:var(--accent);color:var(--accent-ink)}
.entry-links .lk.src{border-style:dashed}
.entry-links .lbl{font-family:var(--ff-mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.sources-block{margin-top:26px;padding-top:18px;border-top:1px solid var(--rule)}
.sources-block h3{font-family:var(--ff-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0 0 12px}
.sources-block a{display:block;text-decoration:none;padding:9px 11px;border-radius:5px;border:1px solid var(--rule);margin-bottom:7px;background:var(--paper)}
.sources-block a:hover{border-color:var(--accent)}
.sources-block b{display:block;font-family:var(--ff-ui);font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:2px}
.sources-block span{display:block;font-family:var(--ff-ui);font-size:11.5px;line-height:1.45;color:var(--ink-3)}

.scrim{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .22s ease}
.scrim.on{opacity:1;pointer-events:auto}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:960px){
  body{font-size:16.5px}
  #menuBtn{display:grid}
  .rail{position:fixed;z-index:60;left:0;top:0;bottom:0;height:100dvh;transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--shadow)}
  .rail.open{transform:none}
  .topwrap{top:53px}
  .newsstrip{padding-inline:20px}
  .doc,.dash{padding-inline:20px}
  .pager{padding-inline:20px;flex-direction:column}
  .pg.next{text-align:left}
  .pg.ghost{display:none}
  .topbar{padding-inline:20px}
  .mh-search .filter{width:150px}
}
@media (max-width:620px){
  .twocol{grid-template-columns:1fr}
  .barrow{grid-template-columns:20px 1fr 46px;gap:9px}
  .barrow .bar{display:none}
  .hero-card{padding:20px}
  .mh-meta{display:none}
}
@media (max-width:430px){
  body{font-size:16px}
  .doc{padding:22px 16px 8px;--col:100%}
  .dash{padding:24px 16px 60px;--col:100%}
  .pager{padding-inline:16px}
  .topbar,.newsstrip{padding-inline:16px}
  .newsstrip .ns-label{display:none}
  .panel{width:100%;max-width:100%}
  .panel-body,.panel-head{padding-inline:16px}
  .doc h2{font-size:21px}
  .doc table{font-size:12.5px}
  .doc thead th,.doc tbody td{padding:8px 11px}
  .masthead{padding-inline:16px;gap:10px}
  .mh-search .filter{width:120px}
  .tiles{grid-template-columns:repeat(2,1fr)}
}
