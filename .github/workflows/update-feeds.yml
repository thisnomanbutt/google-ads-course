name: Update announcement feeds

# Pulls official Google feeds, rebuilds the page, commits the result,
# and emails the repo owner when Google publishes something new.
#
# Runs server-side so CORS never applies.

on:
  schedule:
    - cron: '0 5 * * *'     # every day at 05:00 UTC (10:00 PKT)
  workflow_dispatch:         # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'news-curated.json'
      - '_build/**'

permissions:
  contents: write
  issues: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch official feeds
        run: node _build/fetch-feeds.mjs

      - name: Rebuild the page
        run: bash _build/build.sh

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain news.json index.html)" ]; then
            echo "No changes to publish."
            exit 0
          fi
          git add news.json index.html
          git commit -m "Update announcements $(date -u +%Y-%m-%d)"
          git push

      # Assigning the issue to the repo owner sends them an email under
      # GitHub's default notification settings. Nothing to switch on.
      - name: Email the owner if Google published something new
        if: hashFiles('.new-items.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          TITLE="$(cat .new-items-title.txt)"
          gh issue create \
            --title "🔔 $TITLE" \
            --body-file .new-items.md \
            --assignee "$OWNER"
